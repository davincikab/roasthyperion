{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block body %}
<main class="site-main">
    <div class="auth-shell">
        <div class="auth-card">
            <h1>Reset your password</h1>
            <form class="stacked" method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn" type="submit">Send reset email</button>
            </form>
        </div>
    </div>
</main>
{% endblock %}
