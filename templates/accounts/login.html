{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block body %}
<main class="site-main">
    <div class="auth-shell">
        <div class="auth-card">
            <h1>Log in</h1>
            <form class="stacked" method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn" type="submit">Log in</button>
            </form>
            <p class="auth-footer"><a href="{% url 'accounts:password_reset' %}">Forgot your password?</a></p>
        </div>
    </div>
</main>
{% endblock %}
