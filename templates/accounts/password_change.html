{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block body %}
<main class="site-main">
    <div class="auth-shell">
        <div class="auth-card">
            <h1>Change password</h1>
            <form class="stacked" method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn" type="submit">Update password</button>
            </form>
            <p class="auth-footer"><a href="{% url 'accounts:profile' %}"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to profile</a></p>
        </div>
    </div>
</main>
{% endblock %}
