{% extends "base.html" %}
{% block title %}Set a new password{% endblock %}
{% block body %}
<main class="site-main">
    <div class="auth-shell">
        <div class="auth-card">
            <h1>Set a new password</h1>
            {% if validlink %}
                <form class="stacked" method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn" type="submit">Set password</button>
                </form>
            {% else %}
                <p>This password reset link is invalid, possibly because it has already been used.</p>
            {% endif %}
        </div>
    </div>
</main>
{% endblock %}
